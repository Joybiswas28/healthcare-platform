  # ------------------------------------------------------------------ medicine orders (patient)
  /api/v1/medicine-requests:
    get:
      tags: [Medicine orders]
      summary: My medicine requests
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests: { type: array, items: { $ref: "#/components/schemas/MedicineRequest" } }
                  limit: { type: integer }
                  offset: { type: integer }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [Medicine orders]
      summary: Ask nearby pharmacies for medicines
      description: |
        With a platform prescription send JSON with `prescription_id` (items are filled in from it).
        With a paper prescription send multipart/form-data: a `data` field holding the same JSON (without
        `prescription_id`) **followed by** a `file` field (PDF/JPEG/PNG, max 10 MB).
        409 if no verified pharmacy serves the location, or the patient already has 3 open requests.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MedicineRequestInput" }
          multipart/form-data:
            schema:
              type: object
              required: [data, file]
              properties:
                data: { $ref: "#/components/schemas/MedicineRequestInput" }
                file: { type: string, format: binary }
            encoding:
              data: { contentType: application/json }
      responses:
        "201": { $ref: "#/components/responses/MedicineRequest" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/medicine-requests/{requestID}:
    get:
      tags: [Medicine orders]
      summary: A request with all quotes, cheapest first
      parameters: [{ $ref: "#/components/parameters/requestID" }]
      responses:
        "200": { $ref: "#/components/responses/MedicineRequest" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/medicine-requests/{requestID}/cancel:
    post:
      tags: [Medicine orders]
      summary: Cancel an open request
      parameters: [{ $ref: "#/components/parameters/requestID" }]
      responses:
        "200": { $ref: "#/components/responses/MedicineRequest" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/medicine-requests/{requestID}/attachment:
    get:
      tags: [Medicine orders]
      summary: My uploaded prescription
      parameters: [{ $ref: "#/components/parameters/requestID" }]
      responses:
        "200": { $ref: "#/components/responses/File" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/quotes/{quoteID}/accept:
    post:
      tags: [Medicine orders]
      summary: Choose a pharmacy's quote; creates the order with my delivery code
      parameters: [{ $ref: "#/components/parameters/quoteID" }]
      responses:
        "201": { $ref: "#/components/responses/Order" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/medicine-orders:
    get:
      tags: [Medicine orders]
      summary: My medicine orders
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200": { $ref: "#/components/responses/OrderList" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/medicine-orders/{orderID}:
    get:
      tags: [Medicine orders]
      summary: An order with timeline and live rider location
      parameters: [{ $ref: "#/components/parameters/orderID" }]
      responses:
        "200": { $ref: "#/components/responses/Order" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/medicine-orders/{orderID}/cancel:
    post:
      tags: [Medicine orders]
      summary: Cancel before the order is ready
      parameters: [{ $ref: "#/components/parameters/orderID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        "200": { $ref: "#/components/responses/Order" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/medicine-orders/{orderID}/review:
    post:
