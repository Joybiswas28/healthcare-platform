  /api/v1/admin/withdrawals/{withdrawalID}/process:
    post:
      tags: [Admin]
      summary: Mark paid (after sending the money) or reject (money returns to the doctor)
      parameters:
        - { name: withdrawalID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [paid, rejected] }
                payout_ref: { type: string, description: Required when paid (e.g. bKash transaction id) }
                note: { type: string, description: Required when rejected }
      responses:
        "200": { description: Withdrawal, content: { application/json: { schema: { $ref: "#/components/schemas/Withdrawal" } } } }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    limit: { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
    offset: { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
    verificationStatus: { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected] } }
    withdrawalStatus: { name: status, in: query, schema: { type: string, enum: [requested, paid, rejected] } }
    doctorID: { name: doctorID, in: path, required: true, schema: { type: string, format: uuid } }
    chamberID: { name: chamberID, in: path, required: true, schema: { type: string, format: uuid } }
    scheduleID: { name: scheduleID, in: path, required: true, schema: { type: string, format: uuid } }
    appointmentID: { name: appointmentID, in: path, required: true, schema: { type: string, format: uuid } }
    paymentID: { name: paymentID, in: path, required: true, schema: { type: string, format: uuid } }
    consultationID: { name: consultationID, in: path, required: true, schema: { type: string, format: uuid } }
    concernID: { name: concernID, in: path, required: true, schema: { type: string, format: uuid } }
    offerID: { name: offerID, in: path, required: true, schema: { type: string, format: uuid } }
    prescriptionID: { name: prescriptionID, in: path, required: true, schema: { type: string, format: uuid } }
    hospitalID: { name: hospitalID, in: path, required: true, schema: { type: string, format: uuid } }
    photoID: { name: photoID, in: path, required: true, schema: { type: string, format: uuid } }
    userID: { name: userID, in: path, required: true, schema: { type: string, format: uuid } }
    pharmacyID: { name: pharmacyID, in: path, required: true, schema: { type: string, format: uuid } }
    requestID: { name: requestID, in: path, required: true, schema: { type: string, format: uuid } }
    quoteID: { name: quoteID, in: path, required: true, schema: { type: string, format: uuid } }
    orderID: { name: orderID, in: path, required: true, schema: { type: string, format: uuid } }

  requestBodies:
    Reason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason: { type: string, minLength: 5 }
    Verify:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [approved, rejected] }
              note: { type: string, description: Required when rejecting }
    DeliveryCode:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code: { type: string, example: "036717" }
    SSLCommerzForm:
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              val_id: { type: string }
              tran_id: { type: string }
              status: { type: string }

  responses:
    Error:
      description: Error (see the status codes in the API description)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Status:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string }
    Message:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    File:
      description: File content (PDF or image)
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    Profile: { description: Doctor profile, content: { application/json: { schema: { $ref: "#/components/schemas/DoctorProfile" } } } }
    Chamber: { description: Chamber, content: { application/json: { schema: { $ref: "#/components/schemas/Chamber" } } } }
    Schedule: { description: Schedule, content: { application/json: { schema: { $ref: "#/components/schemas/Schedule" } } } }
    Appointment: { description: Appointment, content: { application/json: { schema: { $ref: "#/components/schemas/Appointment" } } } }
    Payment: { description: Payment, content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } } }
    Consultation: { description: Consultation, content: { application/json: { schema: { $ref: "#/components/schemas/Consultation" } } } }
    Concern: { description: Concern, content: { application/json: { schema: { $ref: "#/components/schemas/Concern" } } } }
    Offer: { description: Offer, content: { application/json: { schema: { $ref: "#/components/schemas/Offer" } } } }
    Prescription: { description: Prescription, content: { application/json: { schema: { $ref: "#/components/schemas/Prescription" } } } }
    Hospital: { description: Hospital, content: { application/json: { schema: { $ref: "#/components/schemas/Hospital" } } } }
    StaffDoctor: { description: Doctor at the hospital, content: { application/json: { schema: { $ref: "#/components/schemas/StaffDoctor" } } } }
    Pharmacy: { description: Pharmacy, content: { application/json: { schema: { $ref: "#/components/schemas/Pharmacy" } } } }
    MedicineRequest: { description: Medicine request, content: { application/json: { schema: { $ref: "#/components/schemas/MedicineRequest" } } } }
    Order: { description: Order, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
    Rider: { description: Rider, content: { application/json: { schema: { $ref: "#/components/schemas/Rider" } } } }
    OrderList:
      description: Orders
      content:
        application/json:
          schema:
            type: object
            properties:
              orders: { type: array, items: { $ref: "#/components/schemas/Order" } }
              limit: { type: integer }
              offset: { type: integer }
    WithdrawalList:
      description: Withdrawals
      content:
        application/json:
          schema:
            type: object
            properties:
              withdrawals: { type: array, items: { $ref: "#/components/schemas/Withdrawal" } }
              limit: { type: integer }
              offset: { type: integer }
    AssociationEnded:
      description: Association ended; booking is off for the doctor's chambers at this hospital
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, enum: [removed, left] }
              upcoming_appointments: { type: integer, description: Bookings the hospital should cancel or reschedule }
              upcoming_appointments_note: { type: string }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    # ---- auth
    Role: { type: string, enum: [patient, doctor, hospital_admin, pharmacy, rider, admin] }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        email: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string, enum: [active, suspended] }
        created_at: { type: string, format: date-time }
    RegisterInput:
      type: object
      required: [name, phone, password, otp_code]
      properties:
        name: { type: string, minLength: 2 }
        phone: { type: string }
        password: { type: string, minLength: 8, maxLength: 72 }
        role: { type: string, enum: [patient, doctor, hospital_admin, pharmacy, rider], default: patient }
        otp_code: { type: string, description: From POST /auth/otp with purpose register }
    AuthResult:
      type: object
      properties:
        access_token: { type: string }
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
    Notification:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, example: appointment_booked }
        title: { type: string }
        body: { type: string }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    # ---- doctors
    VerificationStatus: { type: string, enum: [pending, approved, rejected] }
    DoctorProfile:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        bmdc_reg_no: { type: string, nullable: true }
        specialization: { type: string, nullable: true }
        degrees: { type: string, nullable: true }
        experience_years: { type: integer, nullable: true }
        bio: { type: string, nullable: true }
        verification_status: { $ref: "#/components/schemas/VerificationStatus" }
        verification_note: { type: string, nullable: true }
        consultation_enabled: { type: boolean }
        consultation_fee_tokens: { type: integer }
        commission_bps: { type: integer, nullable: true, description: Only shown to the doctor and admins }
    ProfileInput:
      type: object
      required: [bmdc_reg_no, specialization, degrees]
      properties:
        bmdc_reg_no: { type: string, example: A-12345 }
        specialization: { type: string }
        degrees: { type: string, example: "MBBS, FCPS (Medicine)" }
        experience_years: { type: integer, minimum: 0, maximum: 70 }
        bio: { type: string, maxLength: 2000 }
    Schedule:
      type: object
      properties:
        id: { type: string, format: uuid }
        chamber_id: { type: string, format: uuid }
        weekday: { type: integer, minimum: 0, maximum: 6 }
        start_time: { type: string, example: "17:00" }
        end_time: { type: string, example: "21:00" }
        max_patients: { type: integer }
    ScheduleInput:
      type: object
      required: [weekday, start_time, end_time, max_patients]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6 }
        start_time: { type: string, example: "17:00" }
        end_time: { type: string, example: "21:00" }
        max_patients: { type: integer, minimum: 1, maximum: 500 }
    Chamber:
      type: object
      properties:
        id: { type: string, format: uuid }
        doctor_id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        district: { type: string }
        area: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        fee_paisa: { type: integer, format: int64 }
        booking_enabled: { type: boolean }
        hospital_id: { type: string, format: uuid, nullable: true, description: Set for chambers run by a hospital }
        hospital_name: { type: string, nullable: true }
        room: { type: string, nullable: true }
        schedules: { type: array, items: { $ref: "#/components/schemas/Schedule" } }
    ChamberInput:
      type: object
      required: [name, address, district, fee_paisa]
      properties:
        name: { type: string }
        address: { type: string }
        district: { type: string }
        area: { type: string }
        phone: { type: string }
        fee_paisa: { type: integer, format: int64 }
        booking_enabled: { type: boolean, default: true }
    DoctorSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        specialization: { type: string, nullable: true }
        degrees: { type: string, nullable: true }
        experience_years: { type: integer, nullable: true }
        districts: { type: array, items: { type: string } }
        min_fee_paisa: { type: integer, format: int64, nullable: true }
        consultation_enabled: { type: boolean }
        consultation_fee_tokens: { type: integer }
    PublicDoctor:
      allOf:
        - $ref: "#/components/schemas/DoctorProfile"
        - type: object
          properties:
            chambers: { type: array, items: { $ref: "#/components/schemas/Chamber" } }
    AdminDoctor:
      allOf:
        - $ref: "#/components/schemas/DoctorProfile"
        - type: object
          properties:
            phone: { type: string }
            created_at: { type: string, format: date-time }

    # ---- appointments
    Appointment:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticket_code: { type: string, example: K7Q2M4XA }
        status: { type: string, enum: [confirmed, cancelled, completed, no_show, rescheduled] }
        date: { type: string, format: date }
        serial_no: { type: integer }
        fee_paisa: { type: integer, format: int64 }
        start_time: { type: string }
        end_time: { type: string }
        schedule_id: { type: string, format: uuid }
        doctor_id: { type: string, format: uuid }
        doctor_name: { type: string }
        chamber_id: { type: string, format: uuid }
        chamber_name: { type: string }
        chamber_address: { type: string }
        chamber_district: { type: string }
        patient_id: { type: string, format: uuid }
        patient_name: { type: string }
        patient_phone: { type: string }
        hospital_id: { type: string, format: uuid, nullable: true }
        hospital_name: { type: string, nullable: true }
        room: { type: string, nullable: true }
        cancelled_by: { type: string, enum: [patient, hospital, doctor], nullable: true }
        cancel_reason: { type: string, nullable: true }
        rescheduled_to: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
    Availability:
      type: object
      properties:
        schedule_id: { type: string, format: uuid }
        date: { type: string, format: date }
        max_patients: { type: integer }
        booked: { type: integer }
        remaining: { type: integer }

    # ---- wallet
    TokenPackage:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        price_paisa: { type: integer, format: int64 }
        tokens: { type: integer }
        validity_days: { type: integer }
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        package_id: { type: string, format: uuid }
        amount_paisa: { type: integer, format: int64 }
        tokens: { type: integer }
        validity_days: { type: integer }
        provider: { type: string, enum: [dev, sslcommerz] }
        status: { type: string, enum: [pending, paid, failed] }
        checkout_url: { type: string, description: Only when starting a purchase }
        created_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time, nullable: true }
    Wallet:
      type: object
      properties:
        tokens_available: { type: integer }
        token_value_paisa: { type: integer, format: int64 }
        lots:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              tokens_total: { type: integer }
              tokens_remaining: { type: integer }
              expires_at: { type: string, format: date-time }
    LedgerEntry:
      type: object
      properties:
        kind: { type: string, example: consultation_hold }
        reference_id: { type: string, format: uuid, nullable: true }
        amount_paisa: { type: integer, format: int64, description: "Positive is money in, negative is money out" }
        created_at: { type: string, format: date-time }
    Earnings:
      type: object
      properties:
        balance_paisa: { type: integer, format: int64, description: Available to withdraw }
        pending_withdrawal_paisa: { type: integer, format: int64 }
        entries: { type: array, items: { $ref: "#/components/schemas/LedgerEntry" } }
    Withdrawal:
      type: object
      properties:
        id: { type: string, format: uuid }
        doctor_id: { type: string, format: uuid }
        doctor_name: { type: string }
        amount_paisa: { type: integer, format: int64 }
        method: { type: string, enum: [bkash, nagad, bank] }
        account_details: { type: string }
        status: { type: string, enum: [requested, paid, rejected] }
        admin_note: { type: string, nullable: true }
        payout_ref: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        processed_at: { type: string, format: date-time, nullable: true }

    # ---- consultations
    ConsultationStatus: { type: string, enum: [requested, accepted, rejected, active, completed, cancelled] }
    Consultation:
      type: object
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        patient_name: { type: string }
        doctor_id: { type: string, format: uuid }
        doctor_name: { type: string }
        subject: { type: string }
        description: { type: string }
        fee_tokens: { type: integer }
        status: { $ref: "#/components/schemas/ConsultationStatus" }
        reject_reason: { type: string, nullable: true }
        requested_at: { type: string, format: date-time }
        responded_at: { type: string, format: date-time, nullable: true }
        confirmed_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
    ChatMessage:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sender_id: { type: string, format: uuid }
        sender_name: { type: string }
        body: { type: string, nullable: true }
        attachment:
          nullable: true
          type: object
          properties:
            id: { type: string, format: uuid }
            file_name: { type: string }
            content_type: { type: string }
            size_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    Offer:
      type: object
      properties:
        id: { type: string, format: uuid }
        concern_id: { type: string, format: uuid }
        doctor_id: { type: string, format: uuid }
        doctor_name: { type: string }
        specialization: { type: string, nullable: true }
        degrees: { type: string, nullable: true }
        experience_years: { type: integer, nullable: true }
        message: { type: string }
        fee_tokens: { type: integer }
        status: { type: string, enum: [pending, accepted, declined, withdrawn] }
        created_at: { type: string, format: date-time }
    Concern:
      type: object
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid, description: Only for the patient who posted it }
        title: { type: string }
        description: { type: string }
        specialization: { type: string, nullable: true }
        status: { type: string, enum: [open, closed, converted] }
        consultation_id: { type: string, format: uuid, nullable: true }
        offer_count: { type: integer }
        created_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        offers: { type: array, items: { $ref: "#/components/schemas/Offer" }, description: Patient view }
        my_offer: { $ref: "#/components/schemas/Offer" }

    # ---- prescriptions
    Medicine:
      type: object
      required: [name, dosage, duration]
      properties:
        name: { type: string, example: Napa }
        strength: { type: string, example: 500 mg }
        form: { type: string, example: Tab. }
        dosage: { type: string, example: 1+0+1 }
        duration: { type: string, example: 5 days }
        instructions: { type: string, example: after meal }
    PrescriptionInput:
      type: object
      properties:
        consultation_id: { type: string, format: uuid }
        appointment_id: { type: string, format: uuid }
        patient_age: { type: string, example: 34 years }
        patient_gender: { type: string, enum: [male, female, other] }
        chief_complaints: { type: string }
        diagnosis: { type: string }
        medicines: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/Medicine" } }
        investigations: { type: array, maxItems: 20, items: { type: string } }
        advice: { type: string, maxLength: 2000 }
        follow_up_date: { type: string, format: date }
    Prescription:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: MFP3B5E7R2 }
        doctor_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        consultation_id: { type: string, format: uuid, nullable: true }
        appointment_id: { type: string, format: uuid, nullable: true }
        doctor_name: { type: string }
        doctor_degrees: { type: string, nullable: true }
        doctor_specialization: { type: string, nullable: true }
        doctor_bmdc: { type: string }
        patient_name: { type: string }
        patient_age: { type: string, nullable: true }
        patient_gender: { type: string, nullable: true }
        chief_complaints: { type: string, nullable: true }
        diagnosis: { type: string, nullable: true }
        medicines: { type: array, items: { $ref: "#/components/schemas/Medicine" } }
        investigations: { type: array, items: { type: string } }
        advice: { type: string, nullable: true }
        follow_up_date: { type: string, format: date, nullable: true }
        status: { type: string, enum: [issued, revoked] }
        revoked_reason: { type: string, nullable: true }
        issued_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
    PrescriptionVerification:
      type: object
      properties:
        code: { type: string }
        status: { type: string, enum: [issued, revoked] }
        issued_at: { type: string, format: date-time }
        doctor_name: { type: string }
        doctor_bmdc: { type: string }
        doctor_specialization: { type: string, nullable: true }
        patient_name: { type: string, example: "K**** U****" }
        medicines: { type: array, items: { $ref: "#/components/schemas/Medicine" } }

    # ---- hospitals
    Hospital:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        registration_no: { type: string }
        description: { type: string, nullable: true }
        address: { type: string }
        district: { type: string }
        area: { type: string, nullable: true }
        phone: { type: string }
        email: { type: string, nullable: true }
        website: { type: string, nullable: true }
        departments: { type: array, items: { type: string } }
        facilities: { type: array, items: { type: string } }
        visiting_hours: { type: string, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        map_url: { type: string, nullable: true }
        logo_url: { type: string, nullable: true }
        verification_status: { $ref: "#/components/schemas/VerificationStatus" }
        verification_note: { type: string, nullable: true }
        doctor_count: { type: integer }
        created_at: { type: string, format: date-time }
        verified_at: { type: string, format: date-time, nullable: true }
        my_role: { type: string, enum: [owner, staff], description: Only in management views }
    HospitalInput:
      type: object
      required: [name, registration_no, address, district, phone]
      properties:
        name: { type: string }
        registration_no: { type: string, description: DGHS licence number }
        description: { type: string }
        address: { type: string }
        district: { type: string }
        area: { type: string }
        phone: { type: string }
        email: { type: string }
        website: { type: string }
        departments: { type: array, items: { type: string } }
        facilities: { type: array, items: { type: string } }
        visiting_hours: { type: string }
        latitude: { type: number }
        longitude: { type: number }
    HospitalChamberInput:
      type: object
      required: [fee_paisa]
      properties:
        fee_paisa: { type: integer, format: int64 }
        room: { type: string, example: "Room 412, 4th floor" }
        booking_enabled: { type: boolean, default: true }
    Photo:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
    StaffDoctor:
      type: object
      properties:
        doctor_id: { type: string, format: uuid }
        name: { type: string }
        specialization: { type: string, nullable: true }
        degrees: { type: string, nullable: true }
        experience_years: { type: integer, nullable: true }
        bmdc_reg_no: { type: string, nullable: true }
        department: { type: string, nullable: true }
        designation: { type: string, nullable: true }
        status: { type: string, enum: [invited, active, declined, removed, left] }
        chambers: { type: array, items: { $ref: "#/components/schemas/Chamber" } }
    PublicHospital:
      allOf:
        - $ref: "#/components/schemas/Hospital"
        - type: object
          properties:
            photos: { type: array, items: { $ref: "#/components/schemas/Photo" } }
            doctors: { type: array, items: { $ref: "#/components/schemas/StaffDoctor" } }
    Invitation:
      type: object
      properties:
        hospital_id: { type: string, format: uuid }
        hospital_name: { type: string }
        district: { type: string }
        department: { type: string, nullable: true }
        designation: { type: string, nullable: true }
        status: { type: string, enum: [invited, active] }
        created_at: { type: string, format: date-time }
    Member:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        role: { type: string, enum: [owner, staff] }
        created_at: { type: string, format: date-time }

    # ---- pharmacy
    Pharmacy:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        drug_license_no: { type: string }
        address: { type: string }
        district: { type: string }
        area: { type: string, nullable: true }
        phone: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        opening_hours: { type: string, nullable: true }
        offers_delivery: { type: boolean }
        delivery_radius_km: { type: number }
        accepting_orders: { type: boolean }
        verification_status: { $ref: "#/components/schemas/VerificationStatus" }
        verification_note: { type: string, nullable: true }
        rating: { type: number, nullable: true }
        review_count: { type: integer }
        distance_km: { type: number, description: Only in nearby search }
        created_at: { type: string, format: date-time }
        verified_at: { type: string, format: date-time, nullable: true }
    PharmacyInput:
      type: object
      required: [name, drug_license_no, address, district, phone, latitude, longitude]
      properties:
        name: { type: string }
        drug_license_no: { type: string, description: DGDA drug licence }
        address: { type: string }
        district: { type: string }
        area: { type: string }
        phone: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        opening_hours: { type: string }
        offers_delivery: { type: boolean, default: true }
        delivery_radius_km: { type: number, default: 5, minimum: 0.5, maximum: 20 }
        accepting_orders: { type: boolean, default: true }
    Review:
      type: object
      properties:
        rating: { type: integer }
        comment: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    Item:
      type: object
      required: [name]
      properties:
        name: { type: string }
        strength: { type: string }
        quantity: { type: string, example: 10 tablets }
    QuotedItem:
      type: object
      required: [name, available, price_paisa]
      properties:
        name: { type: string }
        strength: { type: string }
        quantity: { type: string }
        available: { type: boolean }
        price_paisa: { type: integer, format: int64, description: For the whole quantity; 0 when unavailable }
    MedicineRequestInput:
      type: object
      required: [fulfilment, latitude, longitude]
      properties:
        prescription_id: { type: string, format: uuid, description: A platform prescription (JSON requests only) }
        items: { type: array, items: { $ref: "#/components/schemas/Item" } }
        note: { type: string, maxLength: 500 }
        fulfilment: { type: string, enum: [delivery, pickup] }
        address: { type: string, description: Required for delivery }
        latitude: { type: number }
        longitude: { type: number }
        contact_phone: { type: string, description: Defaults to the account's phone }
    Quote:
      type: object
      properties:
        id: { type: string, format: uuid }
        request_id: { type: string, format: uuid }
        pharmacy_id: { type: string, format: uuid }
        pharmacy_name: { type: string }
        pharmacy_area: { type: string, nullable: true }
        pharmacy_rating: { type: number, nullable: true }
        pharmacy_review_count: { type: integer }
        distance_km: { type: number }
        items: { type: array, items: { $ref: "#/components/schemas/QuotedItem" } }
        available_count: { type: integer }
        medicines_total_paisa: { type: integer, format: int64 }
        delivery_charge_paisa: { type: integer, format: int64 }
        total_paisa: { type: integer, format: int64 }
        eta_minutes: { type: integer }
        note: { type: string, nullable: true }
        status: { type: string, enum: [pending, accepted, declined, withdrawn] }
        created_at: { type: string, format: date-time }
    QuoteInput:
      type: object
      required: [items, eta_minutes]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/QuotedItem" } }
        delivery_charge_paisa: { type: integer, format: int64, description: Must be 0 for pickup }
        eta_minutes: { type: integer, minimum: 5, maximum: 1440 }
        note: { type: string, maxLength: 500 }
    MedicineRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        prescription_id: { type: string, format: uuid }
        prescription:
          type: object
          properties:
            code: { type: string }
            status: { type: string }
            doctor_name: { type: string }
            doctor_bmdc: { type: string }
            issued_at: { type: string, format: date-time }
            medicines: { type: array, items: { $ref: "#/components/schemas/Medicine" } }
        has_attachment: { type: boolean }
        items: { type: array, items: { $ref: "#/components/schemas/Item" } }
        note: { type: string, nullable: true }
        fulfilment: { type: string, enum: [delivery, pickup] }
        status: { type: string, enum: [open, ordered, cancelled, expired] }
        quote_count: { type: integer }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        address: { type: string, description: Patient view only }
        contact_phone: { type: string, description: Patient view only }
        quotes: { type: array, items: { $ref: "#/components/schemas/Quote" }, description: Patient view only }
        order_id: { type: string, format: uuid, description: Patient view only }
        distance_km: { type: number, description: Pharmacy view only }
        my_quote: { $ref: "#/components/schemas/Quote" }
    Location:
      type: object
      properties:
        latitude: { type: number }
        longitude: { type: number }
        at: { type: string, format: date-time }
    OrderStatus: { type: string, enum: [confirmed, preparing, ready, rider_assigned, out_for_delivery, delivered, cancelled] }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        request_id: { type: string, format: uuid }
        prescription_id: { type: string, format: uuid, nullable: true }
        patient_id: { type: string, format: uuid }
        patient_name: { type: string }
        contact_phone: { type: string }
        address: { type: string, nullable: true }
        latitude: { type: number }
        longitude: { type: number }
        pharmacy_id: { type: string, format: uuid }
        pharmacy_name: { type: string }
        pharmacy_phone: { type: string }
        pharmacy_address: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/QuotedItem" } }
        medicines_total_paisa: { type: integer, format: int64 }
        delivery_charge_paisa: { type: integer, format: int64 }
        total_paisa: { type: integer, format: int64, description: Cash to pay on delivery }
        payment_method: { type: string, example: cash_on_delivery }
        fulfilment: { type: string, enum: [delivery, pickup] }
        delivery_mode: { type: string, enum: [pharmacy, rider], nullable: true }
        rider_id: { type: string, format: uuid, nullable: true }
        rider_name: { type: string, nullable: true }
        rider_phone: { type: string, nullable: true }
        rider_location: { $ref: "#/components/schemas/Location" }
        status: { $ref: "#/components/schemas/OrderStatus" }
        cancelled_by: { type: string, enum: [patient, pharmacy], nullable: true }
        cancel_reason: { type: string, nullable: true }
        commission_paisa: { type: integer, format: int64, description: "Pharmacy view, after delivery" }
        delivery_code: { type: string, description: Patient view only; give it at handover }
        reviewed: { type: boolean }
        events:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              note: { type: string, nullable: true }
              created_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time, nullable: true }
    Statement:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        delivered_orders: { type: integer }
        medicines_total_paisa: { type: integer, format: int64 }
        delivery_total_paisa: { type: integer, format: int64 }
        commission_due_paisa: { type: integer, format: int64 }
    Rider:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        nid_number: { type: string }
        vehicle: { type: string, enum: [bicycle, motorcycle, car, on_foot] }
        verification_status: { $ref: "#/components/schemas/VerificationStatus" }
        verification_note: { type: string, nullable: true }
        available: { type: boolean }
        location:
          description: Last reported position; null until the rider sends one
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Location" }]
        created_at: { type: string, format: date-time }
    Job:
      type: object
      properties:
        order_id: { type: string, format: uuid }
        pharmacy_name: { type: string }
        pharmacy_address: { type: string }
        pharmacy_latitude: { type: number }
        pharmacy_longitude: { type: number }
        distance_to_pharmacy_km: { type: number }
        delivery_distance_km: { type: number }
        earning_paisa: { type: integer, format: int64 }
        cash_to_collect_paisa: { type: integer, format: int64 }
