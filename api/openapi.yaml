openapi: 3.0.3
info:
  title: Digital Healthcare Platform API
  version: 1.0.0
  description: |
    Backend for doctors, patients, hospitals, pharmacies and delivery riders in Bangladesh.

    **Conventions**
    - Money is in **paisa** (BDT 1 = 100 paisa). One consultation token is worth 10000 paisa.
    - Dates are `YYYY-MM-DD` and times are `HH:MM`, both in Bangladesh time. `weekday`: 0 = Sunday … 6 = Saturday.
    - Phone numbers are Bangladeshi mobiles: `01XXXXXXXXX`, `8801XXXXXXXXX` or `+8801XXXXXXXXX`.
    - Authenticated endpoints need `Authorization: Bearer <access_token>` from login or register.
    - Errors are JSON: `{"error": "message"}`. Status codes: 400 malformed request, 401 not logged in,
      403 wrong role or not allowed, 404 not found (also for other people's resources), 409 conflict with
      the current state, 413 file too large, 415 file type not allowed, 422 validation failed,
      429 too many requests.
    - Lists accept `limit` (default 20, max 100) and `offset`.
servers:
  - url: /
tags:
  - name: System
  - name: Auth
  - name: Notifications
  - name: Doctors
  - name: Doctor (self)
  - name: Appointments
  - name: Wallet
  - name: Payments
  - name: Consultations
  - name: Concerns
  - name: Prescriptions
  - name: Hospitals
  - name: Hospital management
  - name: Pharmacies
  - name: Medicine orders
  - name: Pharmacy management
  - name: Riders
  - name: Admin

security:
  - bearerAuth: []

paths:
  # ------------------------------------------------------------------ system
  /healthz:
    get:
      tags: [System]
      summary: Liveness check
      security: []
      responses:
        "200": { $ref: "#/components/responses/Status" }
  /readyz:
    get:
      tags: [System]
      summary: Readiness check (database reachable)
      security: []
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "503": { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ auth
  /api/v1/auth/otp:
    post:
      tags: [Auth]
      summary: Send a one-time code by SMS
      description: |
        For `register`, an already registered number gets 409. For `reset_password`, an unknown number
        gets the same 202 but no SMS. One code per minute and five per hour per number. Codes expire in 5 minutes.
        In development the code is printed in the server log.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, purpose]
              properties:
                phone: { type: string, example: "01712345678" }
                purpose: { type: string, enum: [register, reset_password] }
      responses:
        "202": { $ref: "#/components/responses/Message" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register (patient, doctor, hospital_admin, pharmacy or rider)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterInput" }
      responses:
        "201": { description: Registered and logged in, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResult" } } } }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in with phone and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string }
                password: { type: string }
      responses:
        "200": { description: Logged in, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResult" } } } }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      summary: Set a new password with a reset_password code
      description: Signs the user out of every device.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otp_code, new_password]
              properties:
                phone: { type: string }
                otp_code: { type: string, example: "123456" }
                new_password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        "200": { description: The user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ notifications
  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: My notifications, newest first
      parameters:
        - { name: unread, in: query, schema: { type: boolean }, description: Only unread ones }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                  unread_count: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all as read
      responses:
        "204": { description: Done }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/notifications/{notificationID}/read:
    post:
      tags: [Notifications]
      summary: Mark one as read
      parameters:
        - { name: notificationID, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Done }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ doctors (public)
  /api/v1/doctors:
    get:
      tags: [Doctors]
      summary: Search verified doctors
      security: []
      parameters:
        - { name: name, in: query, schema: { type: string } }
        - { name: specialization, in: query, schema: { type: string } }
        - { name: location, in: query, schema: { type: string }, description: Chamber district or area }
        - { name: online, in: query, schema: { type: boolean }, description: Only doctors taking online consultations }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Doctors
          content:
            application/json:
              schema:
                type: object
                properties:
                  doctors: { type: array, items: { $ref: "#/components/schemas/DoctorSummary" } }
                  limit: { type: integer }
                  offset: { type: integer }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/doctors/{doctorID}:
    get:
      tags: [Doctors]
      summary: Doctor profile with bookable chambers and schedules
      security: []
      parameters: [{ $ref: "#/components/parameters/doctorID" }]
      responses:
        "200": { description: Doctor, content: { application/json: { schema: { $ref: "#/components/schemas/PublicDoctor" } } } }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/schedules/{scheduleID}/availability:
    get:
      tags: [Appointments]
      summary: Serials booked and remaining for a session on a date
      security: []
      parameters:
        - $ref: "#/components/parameters/scheduleID"
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: Availability, content: { application/json: { schema: { $ref: "#/components/schemas/Availability" } } } }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ doctor (self)
  /api/v1/doctor/profile:
    get:
      tags: [Doctor (self)]
      summary: My doctor profile
      responses:
        "200": { $ref: "#/components/responses/Profile" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [Doctor (self)]
      summary: Update my professional details
      description: A rejected doctor who resubmits goes back to pending. A verified doctor cannot change the BMDC number.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProfileInput" } } }
      responses:
        "200": { $ref: "#/components/responses/Profile" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/doctor/consultation-settings:
    put:
      tags: [Doctor (self)]
      summary: Turn online consultations on/off and set the fee in tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, fee_tokens]
              properties:
                enabled: { type: boolean }
                fee_tokens: { type: integer, minimum: 1, maximum: 20 }
      responses:
        "200": { $ref: "#/components/responses/Profile" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/doctor/chambers:
    get:
      tags: [Doctor (self)]
      summary: My chambers (own and hospital ones) with schedules
      responses:
        "200":
          description: Chambers
          content:
            application/json:
              schema:
                type: object
                properties:
                  chambers: { type: array, items: { $ref: "#/components/schemas/Chamber" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [Doctor (self)]
      summary: Add a private chamber
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChamberInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Chamber" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/doctor/chambers/{chamberID}:
    put:
      tags: [Doctor (self)]
      summary: Update a private chamber (hospital chambers are managed by the hospital)
      parameters: [{ $ref: "#/components/parameters/chamberID" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChamberInput" } } }
      responses:
        "200": { $ref: "#/components/responses/Chamber" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/doctor/chambers/{chamberID}/schedules:
    post:
      tags: [Doctor (self)]
      summary: Add a weekly session to a private chamber
      description: Sessions of the same doctor may not overlap, across all chambers and hospitals (409).
      parameters: [{ $ref: "#/components/parameters/chamberID" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleInput" } } }
      responses:
        "201": { $ref: "#/components/responses/Schedule" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/doctor/schedules/{scheduleID}:
    delete:
      tags: [Doctor (self)]
      summary: Remove a session (existing bookings stay valid)
      parameters: [{ $ref: "#/components/parameters/scheduleID" }]
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/doctor/appointments:
    get:
      tags: [Doctor (self)]
      summary: My patient list for a day
      parameters:
        - { name: date, in: query, schema: { type: string, format: date }, description: Defaults to today }
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, format: date }
                  appointments: { type: array, items: { $ref: "#/components/schemas/Appointment" } }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/doctor/appointments/{appointmentID}/complete:
    post:
      tags: [Doctor (self)]
      summary: Mark a patient as seen
      parameters: [{ $ref: "#/components/parameters/appointmentID" }]
      responses:
        "200": { $ref: "#/components/responses/Appointment" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/doctor/appointments/{appointmentID}/no-show:
    post:
      tags: [Doctor (self)]
      summary: Mark a patient as no-show
      parameters: [{ $ref: "#/components/parameters/appointmentID" }]
      responses:
        "200": { $ref: "#/components/responses/Appointment" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/doctor/tickets/{code}:
    get:
      tags: [Doctor (self)]
      summary: Look up a ticket shown at the chamber
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, example: K7Q2M4XA } }
      responses:
        "200": { $ref: "#/components/responses/Appointment" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/doctor/earnings:
    get:
      tags: [Doctor (self)]
      summary: Consultation earnings and history
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200": { description: Earnings, content: { application/json: { schema: { $ref: "#/components/schemas/Earnings" } } } }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/doctor/withdrawals:
    get:
      tags: [Doctor (self)]
      summary: My withdrawal requests
      parameters:
        - $ref: "#/components/parameters/withdrawalStatus"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200": { $ref: "#/components/responses/WithdrawalList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [Doctor (self)]
      summary: Request a withdrawal (min BDT 500, one pending at a time)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_paisa, method, account_details]
              properties:
                amount_paisa: { type: integer, format: int64, minimum: 50000 }
                method: { type: string, enum: [bkash, nagad, bank] }
                account_details: { type: string, description: "Mobile number for bkash/nagad; bank name, branch, account name and number for bank" }
      responses:
        "201": { description: Requested, content: { application/json: { schema: { $ref: "#/components/schemas/Withdrawal" } } } }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/doctor/offers:
    get:
      tags: [Concerns]
      summary: My offers on public concerns
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Offers
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers: { type: array, items: { $ref: "#/components/schemas/Offer" } }
                  limit: { type: integer }
                  offset: { type: integer }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/doctor/hospitals:
    get:
      tags: [Doctor (self)]
      summary: Hospital invitations and hospitals I work at
      responses:
        "200":
          description: Hospitals
          content:
            application/json:
              schema:
                type: object
                properties:
                  hospitals: { type: array, items: { $ref: "#/components/schemas/Invitation" } }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/doctor/hospitals/{hospitalID}/accept:
    post:
      tags: [Doctor (self)]
      summary: Accept a hospital's invitation
      parameters: [{ $ref: "#/components/parameters/hospitalID" }]
      responses:
        "204": { description: Joined }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/doctor/hospitals/{hospitalID}/decline:
    post:
      tags: [Doctor (self)]
      summary: Decline a hospital's invitation
      parameters: [{ $ref: "#/components/parameters/hospitalID" }]
      responses:
        "204": { description: Declined }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/doctor/hospitals/{hospitalID}/leave:
    post:
      tags: [Doctor (self)]
      summary: Leave a hospital (booking stops; existing bookings remain for the hospital to handle)
      parameters: [{ $ref: "#/components/parameters/hospitalID" }]
      responses:
        "200": { $ref: "#/components/responses/AssociationEnded" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ appointments (patient)
  /api/v1/appointments:
    get:
      tags: [Appointments]
      summary: My appointments, newest first
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointments: { type: array, items: { $ref: "#/components/schemas/Appointment" } }
                  limit: { type: integer }
                  offset: { type: integer }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [Appointments]
      summary: Book the next serial in a session
      description: |
        Up to 30 days ahead, one booking per session, at most 5 upcoming appointments per patient.
        409 when the session is full.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schedule_id, date]
              properties:
                schedule_id: { type: string, format: uuid }
                date: { type: string, format: date }
      responses:
        "201": { $ref: "#/components/responses/Appointment" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/appointments/{appointmentID}/cancel:
    post:
      tags: [Appointments]
      summary: Cancel an upcoming appointment
      parameters: [{ $ref: "#/components/parameters/appointmentID" }]
      responses:
        "200": { $ref: "#/components/responses/Appointment" }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ wallet & payments
  /api/v1/token-packages:
    get:
      tags: [Wallet]
      summary: Token packages for sale
      security: []
      responses:
        "200":
          description: Packages
          content:
            application/json:
              schema:
                type: object
                properties:
                  packages: { type: array, items: { $ref: "#/components/schemas/TokenPackage" } }
                  token_value_paisa: { type: integer, format: int64, example: 10000 }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/wallet:
    get:
      tags: [Wallet]
      summary: My tokens (spendable lots, earliest expiry first)
      responses:
        "200": { description: Wallet, content: { application/json: { schema: { $ref: "#/components/schemas/Wallet" } } } }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/wallet/history:
    get:
      tags: [Wallet]
      summary: Token purchases, holds, refunds and expiries
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: { type: array, items: { $ref: "#/components/schemas/LedgerEntry" } }
                  limit: { type: integer }
                  offset: { type: integer }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/wallet/purchases:
    post:
      tags: [Wallet]
      summary: Start buying a token package
      description: Open the returned `checkout_url` to pay. Tokens arrive once the payment provider confirms.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [package_id]
              properties:
                package_id: { type: string, format: uuid }
      responses:
        "201": { $ref: "#/components/responses/Payment" }
        "502": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/wallet/purchases/{paymentID}:
    get:
      tags: [Wallet]
      summary: Payment status (poll after returning from checkout)
      parameters: [{ $ref: "#/components/parameters/paymentID" }]
      responses:
        "200": { $ref: "#/components/responses/Payment" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/dev/payments/{paymentID}/succeed:
    post:
      tags: [Payments]
      summary: "Development only: simulate a successful payment"
      description: Exists only outside production while SSLCommerz is not configured.
      parameters: [{ $ref: "#/components/parameters/paymentID" }]
      responses:
        "200": { $ref: "#/components/responses/Payment" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/payments/sslcommerz/ipn:
    post:
      tags: [Payments]
      summary: SSLCommerz server-to-server notification (called by SSLCommerz, not by apps)
      security: []
      requestBody: { $ref: "#/components/requestBodies/SSLCommerzForm" }
      responses:
        "200": { description: Received }
  /api/v1/payments/sslcommerz/success:
    post:
      tags: [Payments]
      summary: SSLCommerz browser redirect after paying
      description: "Redirects to `FRONTEND_URL/payments/result?status=success|pending&payment_id=…`."
      security: []
      requestBody: { $ref: "#/components/requestBodies/SSLCommerzForm" }
      responses:
        "303": { description: Redirect to the frontend }
  /api/v1/payments/sslcommerz/fail:
    post:
      tags: [Payments]
      summary: SSLCommerz browser redirect after a failed payment
      security: []
      requestBody: { $ref: "#/components/requestBodies/SSLCommerzForm" }
      responses:
        "303": { description: "Redirect to the frontend with status=failed" }
  /api/v1/payments/sslcommerz/cancel:
    post:
      tags: [Payments]
      summary: SSLCommerz browser redirect after cancelling
      security: []
      requestBody: { $ref: "#/components/requestBodies/SSLCommerzForm" }
      responses:
        "303": { description: "Redirect to the frontend with status=cancelled" }

  # ------------------------------------------------------------------ consultations
  /api/v1/consultations:
    get:
      tags: [Consultations]
      summary: My consultations (as patient or doctor)
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ConsultationStatus" } }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Consultations
          content:
            application/json:
              schema:
                type: object
                properties:
                  consultations: { type: array, items: { $ref: "#/components/schemas/Consultation" } }
                  limit: { type: integer }
                  offset: { type: integer }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [Consultations]
      summary: "Patient: request a private consultation"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doctor_id, subject, description]
              properties:
                doctor_id: { type: string, format: uuid }
                subject: { type: string, minLength: 5, maxLength: 150 }
                description: { type: string, minLength: 20, maxLength: 5000 }
      responses:
        "201": { $ref: "#/components/responses/Consultation" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/consultations/{consultationID}:
    get:
      tags: [Consultations]
      summary: One consultation (patient or doctor only)
      parameters: [{ $ref: "#/components/parameters/consultationID" }]
      responses:
        "200": { $ref: "#/components/responses/Consultation" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/consultations/{consultationID}/accept:
    post:
      tags: [Consultations]
      summary: "Doctor: accept a request"
      parameters: [{ $ref: "#/components/parameters/consultationID" }]
      responses:
        "200": { $ref: "#/components/responses/Consultation" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/consultations/{consultationID}/reject:
    post:
      tags: [Consultations]
      summary: "Doctor: reject a request"
      parameters: [{ $ref: "#/components/parameters/consultationID" }]
      requestBody: { $ref: "#/components/requestBodies/Reason" }
      responses:
        "200": { $ref: "#/components/responses/Consultation" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/consultations/{consultationID}/confirm:
    post:
      tags: [Consultations]
      summary: "Patient: pay with tokens; the consultation becomes active"
      description: 409 when the patient does not have enough tokens.
      parameters: [{ $ref: "#/components/parameters/consultationID" }]
      responses:
        "200": { $ref: "#/components/responses/Consultation" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/consultations/{consultationID}/complete:
    post:
      tags: [Consultations]
      summary: "Doctor: complete and receive payment"
      parameters: [{ $ref: "#/components/parameters/consultationID" }]
      responses:
        "200": { $ref: "#/components/responses/Consultation" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/consultations/{consultationID}/cancel:
    post:
      tags: [Consultations]
      summary: Cancel (patient before it starts; doctor while active, with full refund)
      parameters: [{ $ref: "#/components/parameters/consultationID" }]
      responses:
        "200": { $ref: "#/components/responses/Consultation" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/consultations/{consultationID}/messages:
    get:
      tags: [Consultations]
      summary: Messages after a given id, oldest first
      parameters:
        - $ref: "#/components/parameters/consultationID"
        - { name: after, in: query, schema: { type: integer, format: int64 }, description: Last message id you have }
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [Consultations]
      summary: Send a message (active consultations only)
      parameters: [{ $ref: "#/components/parameters/consultationID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "201": { description: Sent, content: { application/json: { schema: { $ref: "#/components/schemas/ChatMessage" } } } }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/consultations/{consultationID}/attachments:
    post:
      tags: [Consultations]
      summary: Share a report (PDF/JPEG/PNG, max 10 MB) as a message
      parameters: [{ $ref: "#/components/parameters/consultationID" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: Shared, content: { application/json: { schema: { $ref: "#/components/schemas/ChatMessage" } } } }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/consultations/{consultationID}/ws:
    get:
      tags: [Consultations]
      summary: Live chat over WebSocket
      description: |
        Connect with `wss://…/consultations/{id}/ws?access_token=<jwt>&after=<last message id>`
        (browsers cannot send headers on WebSockets). The server sends the backlog after `after`, then pushes
        `{"type":"message","message":{…ChatMessage}}` as messages arrive. Send `{"body":"…"}` to post a message.
        Rejected messages produce `{"type":"error","error":"…"}`.
      parameters:
        - $ref: "#/components/parameters/consultationID"
        - { name: access_token, in: query, required: true, schema: { type: string } }
        - { name: after, in: query, schema: { type: integer, format: int64 } }
      responses:
        "101": { description: Switching to WebSocket }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/consultations/{consultationID}/events:
    get:
      tags: [Consultations]
      summary: Live chat as Server-Sent Events
      description: |
        Authenticated with the normal Authorization header, so a website can relay it through its own server
        instead of giving the token to the browser. Sends the backlog after `after`, then each new message as
        `event: message` whose `id` is the message id and whose `data` is a ChatMessage as JSON. A reconnecting
        client sends `Last-Event-ID` and the stream resumes after it. Comment lines (`: ping`) keep the
        connection open. Post messages with `POST /consultations/{id}/messages`.
      parameters:
        - $ref: "#/components/parameters/consultationID"
        - { name: after, in: query, schema: { type: integer, format: int64 }, description: Last message id you have }
        - { name: Last-Event-ID, in: header, schema: { type: string }, description: Sent by EventSource when it reconnects }
      responses:
        "200": { description: Event stream, content: { text/event-stream: { schema: { type: string } } } }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/attachments/{attachmentID}:
    get:
      tags: [Consultations]
      summary: Download a shared file (consultation participants only)
      parameters:
        - { name: attachmentID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/File" }
        default: { $ref: "#/components/responses/Error" }

