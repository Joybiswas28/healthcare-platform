# Production stack for one server: website + API + PostgreSQL + Caddy (automatic HTTPS).
#
#   cd deploy
#   cp .env.example .env   # fill in every value
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy is reachable from the internet (ports 80/443). The database, the API
# and the website listen on the internal Docker network only.

name: healthcare # fixes volume names (healthcare_pgdata, healthcare_uploads, ...)

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: healthcare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: healthcare
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcare"]
      interval: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://healthcare:${POSTGRES_PASSWORD}@db:5432/healthcare?sslmode=disable
      UPLOAD_DIR: /data/uploads
      TRUST_PROXY: "true" # Caddy (and the website's proxy) pass on the client IP
      PUBLIC_BASE_URL: https://${API_DOMAIN:?set API_DOMAIN in deploy/.env}
      FRONTEND_URL: https://${WEB_DOMAIN:?set WEB_DOMAIN in deploy/.env}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  # The website. Browsers only talk to it; it forwards /api/v1/* to the API over
  # the internal network, keeping the login token in an httpOnly cookie.
  web:
    build:
      context: ../frontend
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
    depends_on:
      - api

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      WEB_DOMAIN: ${WEB_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
