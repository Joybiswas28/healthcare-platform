# Production stack for one server: API + PostgreSQL + Caddy (automatic HTTPS).
#
#   cd deploy
#   cp .env.example .env   # fill in every value
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy is reachable from the internet (ports 80/443). The database and the
# API listen on the internal Docker network only.

name: healthcare # fixes volume names (healthcare_pgdata, healthcare_uploads, ...)

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: healthcare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: healthcare
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcare"]
      interval: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://healthcare:${POSTGRES_PASSWORD}@db:5432/healthcare?sslmode=disable
      UPLOAD_DIR: /data/uploads
      TRUST_PROXY: "true" # Caddy sets the client IP headers
      PUBLIC_BASE_URL: https://${API_DOMAIN:?set API_DOMAIN in deploy/.env}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
